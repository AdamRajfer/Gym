# Experimental file-task pairing, not the AA-v2/Stirrup protocol.
config_paths:
- resources_servers/gdpval/configs/gdpval.yaml
- responses_api_agents/opencode_agent/configs/opencode_agent.yaml
- environment_servers/single_agent_turn_legacy/configs/single_agent_turn_legacy.yaml
gdpval_resources_server:
  resources_servers:
    gdpval:
      entrypoint: app.py
      sandbox_provider: sandbox
      num_workers: 1
      allowed_agents:
      - opencode_agent
      image: ???
      deliverables_root: ???
      verified: false
opencode_agent:
  responses_api_agents:
    opencode_agent:
      # Native session: borrow the GDP task sandbox; Resources owns its lifecycle.
      execution_mode: sandbox
      model: ${policy_model_name}
single_agent_turn_legacy:
  environment_servers:
    single_agent_turn_legacy:
      resources_server:
        name: gdpval_resources_server
      agent_server:
        name: opencode_agent
      max_concurrent_episodes: 1
      queue_timeout_seconds: 60
# Requires an existing, audited GDP SIF and Apptainer installation.
sandbox:
  apptainer:
    create:
      mount_point: /workspace
      extra_start_args: [--containall, --writable-tmpfs]
    exec:
      extra_exec_args: [--writable-tmpfs]
gdpval_judge_model:
  responses_api_models:
    openai_model:
      entrypoint: app.py
      openai_base_url: ???
      openai_api_key: ???
      openai_model: ???
